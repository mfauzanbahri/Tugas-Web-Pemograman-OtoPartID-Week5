<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar Sparepart - OtoPartID</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body data-page="daftar" class="min-h-screen flex flex-col bg-gray-100 text-slate-800">
  <header class="bg-slate-900 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4">
      <div class="flex items-center justify-between h-14">
        <a href="index.html" class="text-lg font-bold text-white">Oto<span class="text-amber-400">PartID</span></a>
        <button id="menuBtn" type="button" class="md:hidden text-white p-2" aria-label="Buka menu" aria-expanded="false" aria-controls="menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <nav class="hidden md:flex gap-1"><a href="index.html" class="block px-3 py-2 rounded-md text-sm font-medium text-slate-200 hover:bg-slate-700">Dashboard</a><a href="daftar.html" class="block px-3 py-2 rounded-md text-sm font-medium bg-amber-500 text-slate-900">Daftar Sparepart</a><a href="form.html" class="block px-3 py-2 rounded-md text-sm font-medium text-slate-200 hover:bg-slate-700">Tambah Data</a></nav>
      </div>
      <nav id="menu" class="hidden md:hidden pb-3 space-y-1"><a href="index.html" class="block px-3 py-2 rounded-md text-sm font-medium text-slate-200 hover:bg-slate-700">Dashboard</a><a href="daftar.html" class="block px-3 py-2 rounded-md text-sm font-medium bg-amber-500 text-slate-900">Daftar Sparepart</a><a href="form.html" class="block px-3 py-2 rounded-md text-sm font-medium text-slate-200 hover:bg-slate-700">Tambah Data</a></nav>
    </div>
  </header>
  <main class="max-w-6xl w-full mx-auto px-4 py-6 flex-grow">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
      <div>
        <h1 class="text-2xl font-bold">Daftar Sparepart</h1>
        <p class="text-slate-500">Komponen kendaraan yang tersedia di sistem.</p>
      </div>
      <button id="btnToggleForm" type="button" aria-expanded="false" aria-controls="formCepat" class="rounded-md bg-amber-500 hover:bg-amber-400 text-slate-900 font-semibold px-4 py-2 text-center">Tambah sparepart</button>
    </div>
    <div class="bg-white rounded-lg shadow overflow-hidden">
      <div id="formCepat" style="display:none" class="p-4 border-b bg-amber-50">
        <form class="form-sparepart grid grid-cols-1 md:grid-cols-4 gap-3" data-mode="cepat" novalidate>
          <div><label for="qKode" class="block text-sm font-semibold mb-1">Kode OEM</label><input type="text" id="qKode" name="kodeOem" class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400"></div>
          <div><label for="qNama" class="block text-sm font-semibold mb-1">Nama sparepart</label><input type="text" id="qNama" name="namaPart" class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400"></div>
          <div><label for="qKat" class="block text-sm font-semibold mb-1">Kategori</label><select id="qKat" name="kategori" class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400"><option>Sistem Pengereman</option><option>Oli &amp; Pelumas</option><option>Kelistrikan &amp; Busi</option><option>Filter &amp; Udara</option></select></div>
          <div><label for="qHarga" class="block text-sm font-semibold mb-1">Harga termurah (Rp)</label><input type="number" id="qHarga" name="hargaTermurah" min="0" class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400"></div>
          <div class="md:col-span-4 flex gap-2">
            <button type="submit" class="rounded-md bg-green-600 hover:bg-green-500 text-white font-semibold px-4 py-2">Simpan data</button>
            <button type="reset" class="rounded-md border border-red-500 text-red-600 hover:bg-red-50 font-semibold px-4 py-2">Hapus isian</button>
          </div>
        </form>
      </div>
      <div class="p-4 border-b grid grid-cols-1 md:grid-cols-3 gap-3">
        <input type="search" id="cari" placeholder="Cari nama atau kode OEM" aria-label="Cari sparepart" class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
        <select id="filterKategori" aria-label="Filter kategori" class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400"><option value="">Semua kategori</option><option>Sistem Pengereman</option><option>Oli &amp; Pelumas</option><option>Kelistrikan &amp; Busi</option><option>Filter &amp; Udara</option></select>
        <select id="urutkan" aria-label="Urutkan" class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400"><option value="nama-asc">Nama A-Z</option><option value="harga-asc">Harga termurah dulu</option><option value="harga-desc">Harga termahal dulu</option></select>
      </div>
      <p id="jumlahData" class="px-4 py-2 text-sm text-slate-500 border-b"></p>
      <div class="overflow-x-auto"><table class="min-w-full text-sm">
        <thead class="bg-slate-900 text-white"><tr><th class="px-4 py-3 text-left font-semibold">Kode OEM</th><th class="px-4 py-3 text-left font-semibold">Nama Komponen</th><th class="px-4 py-3 text-left font-semibold">Kategori</th><th class="px-4 py-3 text-left font-semibold">Harga Termurah</th><th class="px-4 py-3 text-left font-semibold">Aksi</th></tr></thead>
        <tbody id="tabelSparepart" class="divide-y divide-gray-200"></tbody>
      </table></div>
    </div>
  </main>
  <footer class="bg-slate-900 text-slate-300 text-center text-sm py-4 px-4">&copy; 2026 OtoPartID - Tugas Pemrograman Web - Muhammad Fauzan Bahri</footer>
  <div id="toast" role="status" aria-live="polite" style="display:none" class="fixed bottom-4 left-4 right-4 sm:left-auto sm:max-w-sm z-50 rounded-md px-4 py-3 text-white shadow-lg"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    // Menu mobile (jQuery)
    $(function () {
      $("#menuBtn").on("click", function () {
        const buka = $("#menu").toggleClass("hidden").hasClass("hidden") === false;
        $(this).attr("aria-expanded", buka);
      });
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
