<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tambah Data - OtoPartID</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body data-page="form" class="min-h-screen flex flex-col bg-gray-100 text-slate-800">
  <header class="bg-slate-900 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4">
      <div class="flex items-center justify-between h-14">
        <a href="index.html" class="text-lg font-bold text-white">Oto<span class="text-amber-400">PartID</span></a>
        <button id="menuBtn" type="button" class="md:hidden text-white p-2" aria-label="Buka menu" aria-expanded="false" aria-controls="menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <nav class="hidden md:flex gap-1"><a href="index.html" class="block px-3 py-2 rounded-md text-sm font-medium text-slate-200 hover:bg-slate-700">Dashboard</a><a href="daftar.html" class="block px-3 py-2 rounded-md text-sm font-medium text-slate-200 hover:bg-slate-700">Daftar Sparepart</a><a href="form.html" class="block px-3 py-2 rounded-md text-sm font-medium bg-amber-500 text-slate-900">Tambah Data</a></nav>
      </div>
      <nav id="menu" class="hidden md:hidden pb-3 space-y-1"><a href="index.html" class="block px-3 py-2 rounded-md text-sm font-medium text-slate-200 hover:bg-slate-700">Dashboard</a><a href="daftar.html" class="block px-3 py-2 rounded-md text-sm font-medium text-slate-200 hover:bg-slate-700">Daftar Sparepart</a><a href="form.html" class="block px-3 py-2 rounded-md text-sm font-medium bg-amber-500 text-slate-900">Tambah Data</a></nav>
    </div>
  </header>
  <main class="max-w-6xl w-full mx-auto px-4 py-6 flex-grow">
    <div class="max-w-2xl mx-auto">
      <h1 class="text-2xl font-bold">Tambah Sparepart</h1>
      <p class="text-slate-500 mb-4">Isi formulir untuk menambahkan komponen baru ke katalog.</p>
      <form class="form-sparepart bg-white rounded-lg shadow p-5 space-y-4" data-mode="halaman" novalidate>
        <div><label for="kodeOem" class="block text-sm font-semibold mb-1">Kode OEM / Part Number</label>
          <input type="text" id="kodeOem" name="kodeOem" placeholder="Contoh: 15601-BZ010" class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400"></div>
        <div><label for="namaPart" class="block text-sm font-semibold mb-1">Nama Sparepart</label>
          <input type="text" id="namaPart" name="namaPart" class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400"></div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label for="kategori" class="block text-sm font-semibold mb-1">Kategori Komponen</label>
            <select id="kategori" name="kategori" class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400"><option>Sistem Pengereman</option><option>Oli &amp; Pelumas</option><option>Kelistrikan &amp; Busi</option><option>Filter &amp; Udara</option></select></div>
          <div><label for="hargaTermurah" class="block text-sm font-semibold mb-1">Estimasi Harga Termurah (Rp)</label>
            <input type="number" id="hargaTermurah" name="hargaTermurah" min="0" class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400"></div>
        </div>
        <div><label for="deskripsi" class="block text-sm font-semibold mb-1">Deskripsi &amp; Kecocokan Kendaraan</label>
          <textarea id="deskripsi" name="deskripsi" rows="4" placeholder="Jelaskan spesifikasi dan daftar motor/mobil yang cocok" class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400"></textarea></div>
        <div class="flex flex-col sm:flex-row gap-2">
          <button type="submit" class="rounded-md bg-green-600 hover:bg-green-500 text-white font-semibold px-5 py-2">Simpan data</button>
          <button type="reset" class="rounded-md border border-red-500 text-red-600 hover:bg-red-50 font-semibold px-5 py-2">Hapus isian</button>
        </div>
      </form>
    </div>
  </main>
  <footer class="bg-slate-900 text-slate-300 text-center text-sm py-4 px-4">&copy; 2026 OtoPartID - Tugas Pemrograman Web - Muhammad Fauzan Bahri</footer>
  <div id="toast" role="status" aria-live="polite" style="display:none" class="fixed bottom-4 left-4 right-4 sm:left-auto sm:max-w-sm z-50 rounded-md px-4 py-3 text-white shadow-lg"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    // Menu mobile (jQuery)
    $(function () {
      $("#menuBtn").on("click", function () {
        const buka = $("#menu").toggleClass("hidden").hasClass("hidden") === false;
        $(this).attr("aria-expanded", buka);
      });
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
